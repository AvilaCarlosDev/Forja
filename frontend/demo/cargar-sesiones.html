<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargar sesiones demo — Forja</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111619; color: #e8eaed; max-width: 560px; margin: 48px auto; padding: 0 20px; }
  h1 { font-size: 22px; color: #ff6b1a; }
  p { color: #9aa4ad; line-height: 1.5; }
  button { display: block; width: 100%; margin: 14px 0; padding: 16px 18px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 12px; background: #ff6b1a; color: #111619; cursor: pointer; text-align: left; }
  button.cliente { background: #1b2126; color: #e8eaed; border: 1px solid #364049; }
  button:hover { filter: brightness(1.08); }
  .hint { font-size: 13px; color: #6b757d; }
</style>
</head>
<body>
<h1>Sesiones demo de Forja</h1>
<p>Carga una cuenta en este navegador (reemplaza la sesión demo anterior y entra directo a la app). Solo funciona con <code>npm run dev</code>:</p>
<button data-sesion="trainer">Coach Demo — entrenador<br><span class="hint">solicitudes, ficha de María con medidas</span></button>
<button class="cliente" data-sesion="cliente">Lucía Demo — cliente<br><span class="hint">Mi coach con Andrea pendiente, Gold Stars Sambil</span></button>
<p class="hint">Una cuenta a la vez por navegador. Para tener las dos abiertas al mismo tiempo, usa una pestaña de incógnito para la segunda.</p>
<p class="hint" id="estado" role="status"></p>
<script type="module">
import { applyDemoSession } from './cargar.js'
for (const b of document.querySelectorAll('button[data-sesion]')) b.addEventListener('click', async () => {
  const estado = document.getElementById('estado')
  try {
    const r = await fetch('./sesion-' + b.dataset.sesion + '.json')
    if (!r.ok) throw new Error('HTTP ' + r.status + '. Corre: node scripts/forja-demo-sessions.mjs')
    applyDemoSession(localStorage, await r.json())
    location.href = '/'
  } catch (e) {
    estado.textContent = 'No se pudo cargar: ' + e.message
  }
})
</script>
</body>
</html>
