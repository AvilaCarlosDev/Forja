<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargar sesiones demo — Forja</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111619; color: #e8eaed; max-width: 560px; margin: 48px auto; padding: 0 20px; }
  h1 { font-size: 22px; color: #ff6b1a; }
  p { color: #9aa4ad; line-height: 1.5; }
  button { display: block; width: 100%; margin: 14px 0; padding: 16px 18px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 12px; background: #ff6b1a; color: #111619; cursor: pointer; text-align: left; }
  button.cliente { background: #1b2126; color: #e8eaed; border: 1px solid #364049; }
  button:hover { filter: brightness(1.08); }
  .hint { font-size: 13px; color: #6b757d; }
</style>
</head>
<body>
<h1>Sesiones demo de Forja</h1>
<p>Cargá una cuenta en este navegador (borra la sesión anterior de prueba y entra directo a la app):</p>
<button onclick="cargar('trainer')">Coach Demo — entrenador<br><span class="hint">solicitudes, ficha de María con medidas</span></button>
<button class="cliente" onclick="cargar('cliente')">Lucía Demo — cliente<br><span class="hint">Mi coach con Andrea pendiente, Gold Stars Sambil</span></button>
<p class="hint">Una cuenta a la vez por navegador. Para tener las dos abiertas al mismo tiempo, usá una pestaña de incógnito para la segunda.</p>
<script>
async function cargar(c) {
  try {
    const r = await fetch('/sesion-' + c + '.js')
    if (!r.ok) throw new Error('HTTP ' + r.status)
    const code = await r.text()
    eval(code.replace('location.reload();', "location.href = '/'"))
  } catch (e) {
    alert('No se pudo cargar: ' + e.message)
  }
}
</script>
</body>
</html>
